<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/layouts/main-layout}">
<head>
    <title th:text="${product.name} + ' - Kicks Store'">Chi Tiết Sản Phẩm</title>
</head>
<body>
<main layout:fragment="content" class="py-5 bg-white">
    <div class="container">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Trang Chủ</a></li>
                <li class="breadcrumb-item"><a th:href="@{/product-list}">Sản Phẩm</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${product.name}">Tên sản phẩm</li>
            </ol>
        </nav>

        <div class="row gx-5 mb-5">
            <div class="col-lg-6 mb-4 mb-lg-0">
                <div class="gallery-main mb-3 border rounded-3 overflow-hidden">
                    <img id="mainProductImage"
                         th:src="${product.thumbnail != null ? product.thumbnail : '/images/no-image.png'}"
                         th:alt="${product.name}"
                         style="width: 100%; height: 500px; object-fit: contain; background: #f8f9fa;">
                </div>
                <div class="gallery-thumbs d-flex gap-2">
                    <div class="gallery-thumb active border rounded" style="width: 80px; height: 80px;">
                        <img th:src="${product.thumbnail}" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="product-brand text-uppercase text-primary-custom fw-bold mb-2"
                     th:text="${product.brand.name}">Brand</div>

                <h1 class="display-6 fw-bold mb-3" th:text="${product.name}">Tên sản phẩm</h1>

                <div class="d-flex align-items-center mb-4">
                    <div class="text-warning me-2">
                        <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star-half-stroke"></i>
                    </div>
                    <span class="text-muted">(24 đánh giá)</span>
                </div>

                <h2 class="text-danger fw-bold mb-4"
                    th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</h2>

                <p class="text-muted mb-4" th:text="${product.description}">Mô tả sản phẩm...</p>

                <form th:action="@{/cart/add}" method="post">
                    <input type="hidden" name="productId" th:value="${product.id}">

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-end mb-2">
                            <h5 class="mb-0 fw-bold small">KÍCH THƯỚC (SIZE EU)</h5>
                            <a href="#" class="text-decoration-underline small text-muted">Hướng dẫn chọn size</a>
                        </div>
                        <div class="d-flex flex-wrap gap-2 size-selector">
                            <input type="radio" class="btn-check" name="size" id="size39" value="39" required>
                            <label class="btn btn-outline-dark px-3 py-2" for="size39">39</label>

                            <input type="radio" class="btn-check" name="size" id="size40" value="40">
                            <label class="btn btn-outline-dark px-3 py-2" for="size40">40</label>

                            <input type="radio" class="btn-check" name="size" id="size41" value="41">
                            <label class="btn btn-outline-dark px-3 py-2" for="size41">41</label>
                        </div>
                    </div>

                    <div class="d-flex gap-3 mb-4">
<!--                        chưa làm để làm sao -->
<!--                        <div class="input-group" style="width: 130px;">-->
<!--                            <button class="btn btn-outline-secondary border" type="button" onclick="changeQty(-1)">-</button>-->
<!--                            <input type="number" id="quantityInput" class="form-control text-center bg-white border" name="quantity" value="1" min="1" readonly>-->
<!--                            <button class="btn btn-outline-secondary border" type="button" onclick="changeQty(1)">+</button>-->
<!--                        </div>-->
                        <div class="text-muted align-self-center small">Danh mục: <span class="fw-bold" th:text="${product.category.name}">Category</span></div>
                    </div>

                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-primary-custom btn-lg flex-grow-1 py-3 fw-bold">
                            <i class="fa-solid fa-cart-shopping me-2"></i> THÊM VÀO GIỎ HÀNG
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-lg px-4"><i class="fa-regular fa-heart"></i></button>
                    </div>
                </form>

                <div class="mt-5 border-top pt-4">
                    <ul class="list-unstyled">
                        <li class="mb-3 small"><i class="fa-solid fa-truck-fast text-primary-custom me-3"></i> Miễn phí giao hàng toàn quốc.</li>
                        <li class="mb-3 small"><i class="fa-solid fa-arrow-rotate-left text-primary-custom me-3"></i> Đổi trả dễ dàng trong vòng 7 ngày.</li>
                        <li class="small"><i class="fa-solid fa-shield-halved text-primary-custom me-3"></i> Cam kết chính hãng 100%.</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-12">
                <ul class="nav nav-tabs mb-4 border-bottom-0" id="productTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active fw-bold text-dark border-0 border-bottom border-3 border-primary" id="desc-tab" data-bs-toggle="tab" data-bs-target="#desc" type="button" role="tab">MÔ TẢ SẢN PHẨM</button>
                    </li>
                </ul>
                <div class="tab-content p-4 bg-light rounded-3" id="productTabContent">
                    <div class="tab-pane fade show active text-muted lh-lg" id="desc" role="tabpanel">
                        <p th:text="${product.description}">Thông tin mô tả chi tiết...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>


</body>
</html>
