<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt hàng thành công</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

<div class="container text-center">
    <div class="card p-5 shadow-sm border-0 mx-auto" style="max-width: 600px;">
        <div class="mb-4 text-success">
            <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" fill="currentColor" class="bi bi-check-circle-fill d-inline-block" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </svg>
        </div>

        <h2 class="fw-bold text-success mb-3">ĐẶT HÀNG THÀNH CÔNG!</h2>

        <p class="fs-5 text-secondary mb-4" th:text="${success} ?: 'Cảm ơn bạn đã tin tưởng mua sắm tại cửa hàng của chúng tôi!'"></p>
        <p class="text-muted small">Đơn hàng của bạn đang được chuyển đến bộ phận Admin để xác nhận và chuẩn bị đóng gói đóng hộp giao đi.</p>

        <div class="mt-4">
            <a th:href="@{/}" class="btn btn-primary px-4 fw-bold me-2">Tiếp tục mua sắm</a>
            <a th:href="@{/order-history}" class="btn btn-outline-secondary px-4 fw-bold">Xem lịch sử mua</a>
        </div>
    </div>
</div>

</body>
</html>
