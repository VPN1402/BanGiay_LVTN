<!DOCTYPE html>
<html lang="vi"  xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/layouts/main-layout}">
<head>
    <title>Thanh Toán - Kicks Store</title>
</head>
<body>
    <main layout:fragment="content" class="py-5 bg-light">
        <div class="container">
            <h2 class="fw-bold mb-4 text-center">Thanh Toán</h2>

            <form th:action="@{/templates/user/order/submit}" method="post">
                <div class="row gx-5">
                    <!-- Shipping Info & Payment -->
                    <div class="col-lg-7 mb-4 mb-lg-0">
                        <!-- Shipping Address -->
                        <div class="bg-white p-4 rounded shadow-sm mb-4">
                            <h5 class="fw-bold mb-4 border-bottom pb-2">Thông Tin Giao Hàng</h5>
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label">Họ và Tên</label>
                                    <input type="text" class="form-control" name="fullName" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Số điện thoại</label>
                                    <input type="tel" class="form-control" name="phone" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" name="email" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Địa chỉ cụ thể</label>
                                    <input type="text" class="form-control" name="address" placeholder="Số nhà, tên đường..." required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Tỉnh / Thành phố</label>
                                    <select class="form-select" name="city">
                                        <option value="">Chọn Tỉnh/Thành</option>
                                        <option value="Hà Nội">Hà Nội</option>
                                        <option value="TP HCM">TP HCM</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Quận / Huyện</label>
                                    <select class="form-select" name="district">
                                        <option value="">Chọn Quận/Huyện</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Phường / Xã</label>
                                    <select class="form-select" name="ward">
                                        <option value="">Chọn Phường/Xã</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Ghi chú đơn hàng (Tùy chọn)</label>
                                    <textarea class="form-control" name="note" rows="2"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Payment Method -->
                        <div class="bg-white p-4 rounded shadow-sm">
                            <h5 class="fw-bold mb-4 border-bottom pb-2">Phương Thức Thanh Toán</h5>
                            
                            <div class="form-check mb-3 p-0">
                                <input class="form-check-input d-none" type="radio" name="paymentMethod" id="paymentCOD" value="COD" checked>
                                <label class="payment-method-label w-100" for="paymentCOD">
                                    <div class="d-flex align-items-center">
                                        <div class="me-3 fs-4 text-secondary"><i class="fa-solid fa-money-bill-wave"></i></div>
                                        <div>
                                            <h6 class="mb-0 fw-bold">Thanh toán khi nhận hàng (COD)</h6>
                                            <small class="text-muted">Thanh toán bằng tiền mặt khi giao hàng</small>
                                        </div>
                                    </div>
                                </label>
                            </div>

                            <div class="form-check mb-3 p-0">
                                <input class="form-check-input d-none" type="radio" name="paymentMethod" id="paymentVNPAY" value="VNPAY">
                                <label class="payment-method-label w-100" for="paymentVNPAY">
                                    <div class="d-flex align-items-center w-100">
                                        <div class="me-3 fs-4 text-primary"><i class="fa-solid fa-credit-card"></i></div>
                                        <div>
                                            <h6 class="mb-0 fw-bold">Thanh toán qua VNPAY</h6>
                                            <small class="text-muted">Thẻ ATM / Internet Banking / Visa / Master</small>
                                        </div>
                                        <!-- Placeholder VNPAY logo -->
                                        <img th:src="@{/images/vnpay-logo.svg}" alt="VNPAY" class="ms-auto" style="height: 25px;">
                                    </div>
                                </label>
                            </div>

                            <div class="form-check p-0">
                                <input class="form-check-input d-none" type="radio" name="paymentMethod" id="paymentMOMO" value="MOMO">
                                <label class="payment-method-label w-100" for="paymentMOMO">
                                    <div class="d-flex align-items-center w-100">
                                        <div class="me-3 fs-4" style="color: #a50064;"><i class="fa-solid fa-wallet"></i></div>
                                        <div>
                                            <h6 class="mb-0 fw-bold">Thanh toán qua Ví MoMo</h6>
                                            <small class="text-muted">Quét mã QR từ ứng dụng MoMo</small>
                                        </div>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Order Summary -->
                    <div class="col-lg-5">
                        <div class="order-summary sticky-top" style="top: 100px;">
                            <h5 class="fw-bold mb-4 border-bottom pb-2">Thông Tin Đơn Hàng</h5>
                            
                            <!-- Items -->
                            <div class="d-flex align-items-center mb-3">
                                <div class="position-relative me-3">
                                    <img th:src="@{/images/checkout-item-1.jpg}" alt="Product" class="rounded border" style="width: 60px; height: 60px; object-fit: cover;">
                                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-secondary">1</span>
                                </div>
                                <div class="flex-grow-1">
                                    <h6 class="mb-0 small text-truncate" style="max-width: 150px;">Nike Air Max 270 React</h6>
                                    <small class="text-muted">Size: 42</small>
                                </div>
                                <div class="text-end small fw-bold">3.500.000đ</div>
                            </div>

                            <div class="d-flex align-items-center mb-4">
                                <div class="position-relative me-3">
                                    <img th:src="@{/images/checkout-item-2.jpg}" alt="Product" class="rounded border" style="width: 60px; height: 60px; object-fit: cover;">
                                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-secondary">1</span>
                                </div>
                                <div class="flex-grow-1">
                                    <h6 class="mb-0 small text-truncate" style="max-width: 150px;">Adidas Ultraboost 22</h6>
                                    <small class="text-muted">Size: 40</small>
                                </div>
                                <div class="text-end small fw-bold">4.200.000đ</div>
                            </div>

                            <div class="border-top pt-3">
                                <div class="d-flex justify-content-between mb-2 small">
                                    <span class="text-muted">Tạm tính:</span>
                                    <span>7.700.000đ</span>
                                </div>
                                <div class="d-flex justify-content-between mb-3 pb-3 border-bottom small">
                                    <span class="text-muted">Phí vận chuyển:</span>
                                    <span>30.000đ</span>
                                </div>
                                <div class="d-flex justify-content-between mb-4">
                                    <span class="fw-bold fs-5">Tổng cộng:</span>
                                    <span class="fw-bold fs-4 text-primary-custom">7.730.000đ</span>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary-custom w-100 btn-lg">Hoàn Tất Đặt Hàng</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
