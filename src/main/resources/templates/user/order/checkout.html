<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/layouts/main-layout}"> <head>
    <meta charset="UTF-8">
    <title>Thanh Toán Đơn Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div layout:fragment="content" class="container py-5">
    <h2 class="mb-4 fw-bold text-center text-uppercase text-primary">Thông Tin Thanh Toán</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/checkout/process}" th:object="${checkoutRequest}" method="post">
        <div class="row g-5">

            <div class="col-md-7 col-lg-8">
                <div class="card p-4 shadow-sm border-0">
                    <h4 class="mb-3 fw-bold">Địa chỉ nhận hàng</h4>

                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-medium">Họ và tên người nhận</label>
                            <input type="text" th:field="*{receiverName}" class="form-control" placeholder="Nguyễn Văn A" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-medium">Số điện thoại</label>
                            <input type="tel" th:field="*{receiverPhone}" class="form-control" placeholder="0901234567" maxlength="10" pattern="0[0-9]{9}" title="phai la so" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-medium">Địa chỉ giao hàng chính xác</label>
                            <input type="text" th:field="*{shippingAddress}" class="form-control" placeholder="Số nhà, tên đường, phường/xã, quận/huyện..." required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-medium">Ghi chú đơn hàng <span class="text-muted">(Tùy chọn)</span></label>
                            <textarea th:field="*{note}" class="form-control" rows="3" placeholder="Ví dụ: Giao giờ hành chính, gọi trước khi giao..."></textarea>
                        </div>
                    </div>

                    <hr class="my-4">

                    <h4 class="mb-3 fw-bold">Phương thức thanh toán</h4>
                    <div class="my-3">
                        <div class="form-check mb-2">
                            <input id="cod" th:field="*{paymentMethod}" value="COD" type="radio" class="form-check-input" checked required>
                            <label class="form-check-label" for="cod">Thanh toán khi nhận hàng (COD)</label>
                        </div>
                        <div class="form-check">
                            <input id="vnpay" th:field="*{paymentMethod}" value="VNPAY" type="radio" class="form-check-input" required>
                            <label class="form-check-label" for="vnpay">Thanh toán trực tuyến qua cổng điện tử VNPay</label>
                        </div>
                    </div>

                    <button class="w-100 btn btn-primary btn-lg fw-bold mt-4" type="submit">XÁC NHẬN ĐẶT HÀNG</button>
                </div>
            </div>

            <div class="col-md-5 col-lg-4">
                <div class="card p-3 shadow-sm border-0 position-sticky" style="top: 80px;">
                    <h4 class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-secondary fw-bold">Giỏ hàng của bạn</span>
                    </h4>

                    <ul class="list-group mb-3 border-0">
                        <li th:each="item : ${cartItems}" class="list-group-item d-flex justify-content-between lh-sm bg-transparent border-bottom px-0 py-3">
                            <div>
                                <h6 class="my-0 fw-bold text-dark" th:text="${item.product.name}">Tên giày Sneaker</h6>
                                <small class="text-muted" th:text="'Size: ' + ${item.size} + ' | SL: ' + ${item.quantity}"></small>
                            </div>
                            <span class="text-muted fw-medium" th:text="${#numbers.formatDecimal(item.price, 0, 'POINT', 0, 'COMMA')} + 'đ'"></span>
                        </li>

                        <li class="list-group-item d-flex justify-content-between bg-transparent border-0 px-0 pt-3">
                            <span class="fw-bold fs-5">Tổng thanh toán:</span>
                            <strong class="text-danger fs-5" th:text="${#numbers.formatDecimal(totalPrice, 0, 'POINT', 0, 'COMMA')} + 'đ'">0đ</strong>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
