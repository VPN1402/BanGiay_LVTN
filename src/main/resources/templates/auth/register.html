<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layouts/main-layout}">
<head>
    <title>Đăng Ký - Kicks Store</title>
</head>
<body>
    <main layout:fragment="content" class="py-5" style="background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);">
        <div class="container my-5">
            <div class="auth-card" style="max-width: 550px;">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark mb-2">Đăng Ký Tài Khoản</h3>
                    <p class="text-muted">Tạo tài khoản để nhận nhiều ưu đãi từ Kicks Store</p>
                </div>

                <form th:action="@{/register}" method="post">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">Họ và Tên</label>
                            <input type="text" class="form-control bg-light" name="fullName" placeholder="VD: Nguyễn Văn A" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">Số điện thoại</label>
                            <input type="tel" class="form-control bg-light" name="phone" placeholder="VD: 0912345678" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-envelope"></i></span>
                            <input type="email" class="form-control border-start-0 bg-light" name="email" placeholder="Nhập email của bạn" required>
                        </div>
                    </div>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">Mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control border-start-0 bg-light" name="password" placeholder="Mật khẩu" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">Xác nhận mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control border-start-0 bg-light" name="confirmPassword" placeholder="Nhập lại" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-check mb-4">
                        <input type="checkbox" class="form-check-input" id="terms" required>
                        <label class="form-check-label small text-muted" for="terms">
                            Tôi đồng ý với các <a href="#" class="text-primary-custom">Điều khoản dịch vụ</a> và <a href="#" class="text-primary-custom">Chính sách bảo mật</a>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary-custom w-100 mb-3 py-2">Đăng Ký</button>

                    <p class="text-center small mb-0">
                        Đã có tài khoản? <a th:href="@{/auth/login}" class="text-primary-custom fw-bold text-decoration-none">Đăng nhập</a>
                    </p>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
