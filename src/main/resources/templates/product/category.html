<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layouts/main-layout}"
      xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <title>Danh Mục Sneaker - Kicks Store</title>
</head>
<body>
    <main layout:fragment="content" class="bg-light">
        <!-- Category Banner -->
        <div class="bg-dark text-white py-5 mb-4 position-relative overflow-hidden">
            <img th:src="@{/images/category-banner.jpg}" alt="Category Banner" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover opacity-25">
            <div class="container position-relative z-1 py-4 text-center">
                <h1 class="display-4 fw-bold mb-2 text-uppercase" th:text="${categoryName ?: 'SNEAKER'}">SNEAKER</h1>
                <p class="lead mb-0 text-white-50">Khám phá các mẫu giày thể thao phong cách đường phố mới nhất.</p>
            </div>
        </div>

        <div class="container pb-5">
            <div class="row">
                <!-- Sidebar -->
                <div class="col-lg-3 mb-4 mb-lg-0">
                    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
                </div>

                <!-- Product Grid -->
                <div class="col-lg-9">
                    <!-- Products -->
                    <div class="row g-4 mb-5">
                        <div class="col-md-4 col-sm-6" th:each="i : ${#numbers.sequence(1, 6)}">
                            <div class="product-card">
                                <a th:href="@{'/product/detail/' + ${i}}" class="product-img-wrapper d-block">
                                    <img th:src="@{'/images/category-product-' + ${i} + '.jpg'}" alt="Product Image">
                                </a>
                                <div class="product-info">
                                    <a th:href="@{'/product/detail/' + ${i}}"><h3 class="product-title" th:text="'Sneaker Style ' + ${i}">Sản phẩm demo</h3></a>
                                    <div class="product-price">2.800.000đ</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Pagination -->
                    <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-center">
                            <li class="page-item disabled"><a class="page-link" href="#">Trang trước</a></li>
                            <li class="page-item active"><a class="page-link" href="#">1</a></li>
                            <li class="page-item"><a class="page-link" href="#">2</a></li>
                            <li class="page-item"><a class="page-link" href="#">Trang sau</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
