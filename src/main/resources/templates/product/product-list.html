<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/main-layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Danh Sách Sản Phẩm - Kicks Store</title>
</head>
<body>
<main layout:fragment="content" class="py-5 bg-light">
    <div class="container">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Trang Chủ</a></li>
                <li class="breadcrumb-item active" aria-current="page">Sản Phẩm</li>
            </ol>
        </nav>

        <div class="row">
            <div class="col-lg-3 mb-4 mb-lg-0">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>

            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
                    <p class="mb-0 text-muted">
                        Hiển thị tất cả <span class="fw-bold text-dark" th:text="${products.size()}">0</span> sản phẩm
                    </p>
                    <div class="d-flex align-items-center">
                        <label class="me-2 text-nowrap mb-0">Sắp xếp theo:</label>
                        <select class="form-select form-select-sm" style="width: auto;">
                            <option value="newest">Mới nhất</option>
                            <option value="price-asc">Giá: Thấp đến Cao</option>
                            <option value="price-desc">Giá: Cao đến Thấp</option>
                        </select>
                    </div>
                </div>

                <div class="row g-4 mb-5">
                    <div class="col-md-4 col-sm-6" th:each="product : ${products}">
                        <div class="product-card">
                            <div class="product-actions">
                                <button class="action-btn" data-bs-toggle="tooltip" title="Yêu thích">
                                    <i class="fa-regular fa-heart"></i>
                                </button>
                                <button class="action-btn btn-add-cart" data-bs-toggle="tooltip" title="Thêm vào giỏ">
                                    <i class="fa-solid fa-cart-plus"></i>
                                </button>
                            </div>

                            <div class="product-img-wrapper">
                                <a th:href="@{/product/detail/{id}(id=${product.id})}">
                                    <img th:src="${product.thumbnail != null and product.thumbnail != '' ? product.thumbnail : 'https://via.placeholder.com/300x300?text=No+Image'}"
                                         th:alt="${product.name}">
                                </a>
                            </div>

                            <div class="product-info">
                                <div class="product-category-text" th:text="${product.category.name}">Thể loại</div>
                                <div class="product-brand" th:text="${product.brand.name}">Thương hiệu</div>

                                <a th:href="@{/product/detail/{id}(id=${product.id})}" class="text-decoration-none">
                                    <h3 class="product-title" th:text="${product.name}">Tên sản phẩm</h3>
                                </a>

                                <div class="product-price"
                                     th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">
                                    0đ
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(products)}">
                        <i class="fa-solid fa-box-open fs-1 text-muted mb-3"></i>
                        <p class="text-muted">Không tìm thấy sản phẩm nào phù hợp.</p>
                    </div>
                </div>

                <nav aria-label="Page navigation" th:if="${not #lists.isEmpty(products)}">
                    <ul class="pagination justify-content-center">
                        <li class="page-item disabled"><a class="page-link" href="#">Trang trước</a></li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">Trang sau</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</main>
</body>
</html>
