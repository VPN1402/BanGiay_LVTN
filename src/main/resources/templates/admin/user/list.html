<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layouts/main-layout}">

<head>
    <title>Quản lý người dùng</title>
</head>

<body>

<div layout:fragment="content">


    <div class="d-flex justify-content-between align-items-center pt-3 pb-3 mb-4 border-bottom">

        <div>

            <h1 class="h2 fw-bold mb-1">
                Quản lý người dùng
            </h1>

            <p class="text-muted mb-0">
                Danh sách tài khoản trong hệ thống
            </p>

        </div>

        <a th:href="@{/admin/user/add}"
           class="btn btn-primary shadow-sm">

            <i class="bi bi-plus-circle me-1"></i>

            Thêm người dùng

        </a>

    </div>


    <div class="card border-0 shadow rounded-4">

        <div class="card-body p-4">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">

                    <tr>

                        <th>ID</th>

                        <th>Họ tên</th>

                        <th>Email</th>

                        <th>SĐT</th>

                        <th>Vai trò</th>

                        <th>Trạng thái</th>

                        <th class="text-center">
                            Thao tác
                        </th>

                    </tr>

                    </thead>

                    <tbody>


                    <tr th:each="u : ${users}">


                        <td class="fw-semibold text-muted"
                            th:text="${u.id}">
                        </td>


                        <td>

                            <div class="fw-semibold"
                                 th:text="${u.fullName}">
                            </div>

                        </td>


                        <td th:text="${u.email}"></td>


                        <td th:text="${u.phone}"></td>


                        <td>

                            <span class="badge bg-primary-subtle text-dark px-3 py-2"
                                  th:text="${u.role != null ? u.role.roleName : 'Chưa có quyền'}">
                            </span>

                        </td>


                        <td>

                            <span th:if="${u.status == 1}"
                                  class="badge bg-success">
                                Hoạt động
                            </span>

                            <span th:if="${u.status == 0}"
                                  class="badge bg-danger">
                                Khóa
                            </span>

                        </td>


                        <td class="text-center">

                            <div class="btn-group">


                                <a th:href="@{'/admin/user/edit/' + ${u.id}}"
                                   class="btn btn-sm btn-outline-primary">

                                    <i class="bi bi-pencil-square"></i>

                                </a>


                                <a th:href="@{'/admin/user/delete/' + ${u.id}}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Bạn có chắc muốn xóa user này?')">

                                    <i class="bi bi-trash"></i>

                                </a>

                            </div>

                        </td>

                    </tr>


                    <tr th:if="${#lists.isEmpty(users)}">

                        <td colspan="7"
                            class="text-center py-5">

                            <div class="text-muted">

                                <i class="bi bi-people fs-1 d-block mb-3"></i>

                                Chưa có người dùng nào

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
