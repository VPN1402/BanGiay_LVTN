<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layouts/main-layout}">

<head>
    <title>Sửa sản phẩm</title>
</head>

<body>

<div layout:fragment="content">

    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <div>
            <h1 class="h2 fw-bold">Cập nhật sản phẩm</h1>
            <p class="text-muted mb-0">Chỉnh sửa thông tin chi tiết sản phẩm cũ</p>
        </div>
    </div>

    <div class="card shadow border-0 rounded-4">
        <div class="card-body p-4">

            <form th:action="@{/admin/product/save}"
                  th:object="${product}"
                  method="post">

                <input type="hidden" th:field="*{id}"/>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        Tên sản phẩm <span class="text-danger">*</span>
                    </label>

                    <input type="text"
                           th:field="*{name}"
                           class="form-control form-control-lg"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                           placeholder="Nhập tên sản phẩm...">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-4">
                        <label class="form-label fw-semibold">
                            Giá bán (VNĐ) <span class="text-danger">*</span>
                        </label>

                        <input type="number"
                               th:field="*{price}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                               placeholder="0">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('price')}"
                             th:errors="*{price}">
                        </div>
                    </div>

                    <div class="col-md-4 mb-4">
                        <label class="form-label fw-semibold">
                            Thương hiệu <span class="text-danger">*</span>
                        </label>

                        <select th:field="*{brand}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('brand')} ? 'is-invalid' : ''">
                            <option value="">-- Chọn thương hiệu --</option>
                            <option th:each="b : ${brands}"
                                    th:value="${b.id}"
                                    th:text="${b.name}">
                            </option>
                        </select>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('brand')}"
                             th:errors="*{brand}">
                        </div>
                    </div>

                    <div class="col-md-4 mb-4">
                        <label class="form-label fw-semibold">
                            Danh mục <span class="text-danger">*</span>
                        </label>

                        <select th:field="*{category}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''">
                            <option value="">-- Chọn danh mục --</option>
                            <option th:each="c : ${categories}"
                                    th:value="${c.id}"
                                    th:text="${c.name}">
                            </option>
                        </select>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('category')}"
                             th:errors="*{category}">
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Link ảnh sản phẩm</label>
                    <input type="text"
                           th:field="*{thumbnail}"
                           class="form-control"
                           placeholder="https://example.com/image.jpg">
                </div>

                <div class="mb-4 text-center"
                     th:if="${product.thumbnail != null and !#strings.isEmpty(product.thumbnail)}">
                    <img th:src="${product.thumbnail}"
                         class="img-fluid rounded shadow-sm border"
                         style="max-height: 250px;">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Mô tả sản phẩm</label>
                    <textarea th:field="*{description}"
                              class="form-control"
                              rows="5"
                              placeholder="Nhập mô tả sản phẩm...">
                    </textarea>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input"
                           type="checkbox"
                           th:field="*{featured}">
                    <label class="form-check-label fw-semibold">
                        Hiển thị ở danh mục nổi bật
                    </label>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-save"></i> Cập nhật
                    </button>
                    <a th:href="@{/admin/products}" class="btn btn-outline-secondary">Quay lại</a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
