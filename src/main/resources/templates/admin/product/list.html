<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layouts/main-layout}">

<head>
    <title>Quản lý sản phẩm</title>
</head>

<body>

<div layout:fragment="content">

    <!-- PAGE HEADER -->
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-3 mb-4 border-bottom">

        <div>
            <h1 class="h2 fw-bold mb-1">
                Quản lý sản phẩm
            </h1>

            <p class="text-muted mb-0">
                Danh sách toàn bộ sản phẩm trong hệ thống
            </p>
        </div>

        <div class="btn-toolbar">

            <a th:href="@{/admin/product/add}"
               class="btn btn-primary shadow-sm">

                <i class="bi bi-plus-circle me-1"></i>

                Thêm sản phẩm

            </a>

        </div>

    </div>

    <!-- CARD -->
    <div class="card border-0 shadow rounded-4">

        <div class="card-body p-4">

            <!-- TABLE -->
            <div class="table-responsive">

                <table class="table align-middle table-hover">

                    <thead class="table-light">

                    <tr>

                        <th>ID</th>

                        <th>Hình ảnh</th>

                        <th>Tên sản phẩm</th>

                        <th>Danh mục</th>

                        <th>Thương hiệu</th>

                        <th>Giá bán</th>

                        <th class="text-center">Thao tác</th>

                    </tr>

                    </thead>

                    <tbody>

                    <!-- LOOP -->
                    <tr th:each="p : ${products}">

                        <!-- ID -->
                        <td class="fw-semibold text-muted"
                            th:text="${p.id}">
                        </td>

                        <!-- IMAGE -->
                        <td>

                            <img th:src="${p.thumbnail != null && !#strings.isEmpty(p.thumbnail)
                                    ? p.thumbnail
                                    : 'https://via.placeholder.com/80'}"

                                 alt="product"

                                 class="rounded border"

                                 style="width: 70px;
                                        height: 70px;
                                        object-fit: cover;">

                        </td>

                        <!-- NAME -->
                        <td>

                            <div class="fw-semibold"
                                 th:text="${p.name}">
                            </div>

                            <small class="text-muted">
                                ID:
                                <span th:text="${p.id}"></span>
                            </small>

                        </td>

                        <!-- CATEGORY -->
                        <td>

                            <span class="badge bg-primary-subtle text-dark px-3 py-2"

                                  th:text="${p.category != null ? p.category.name : 'Chưa có'}">

                            </span>

                        </td>

                        <!-- BRAND -->
                        <td>

                            <span class="badge bg-secondary-subtle text-dark px-3 py-2"

                                  th:text="${p.brand != null ? p.brand.name : 'Chưa có'}">

                            </span>

                        </td>

                        <!-- PRICE -->
                        <td class="fw-bold text-danger">

                            <span th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')}">

                            </span>

                            đ

                        </td>
                        <!-- FEATURED -->
                        <td>

                            <span th:if="${p.featured}"
                                  class="badge bg-success px-3 py-2">

                                Nổi bật

                            </span>

                            <span th:unless="${p.featured}"
                                  class="badge bg-secondary px-3 py-2">

                                Thường

                            </span>

                        </td>

                        <!-- ACTION -->
                        <td class="text-center">

                            <div class="btn-group">

                                <!-- EDIT -->
                                <a th:href="@{'/admin/product/edit/' + ${p.id}}"

                                   class="btn btn-sm btn-outline-primary">

                                    <i class="bi bi-pencil-square"></i>

                                </a>

                                <!-- DELETE -->
                                <a th:href="@{'/admin/product/delete/' + ${p.id}}"

                                   class="btn btn-sm btn-outline-danger"

                                   onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này?')">

                                    <i class="bi bi-trash"></i>

                                </a>

                            </div>

                        </td>

                    </tr>

                    <!-- EMPTY -->
                    <tr th:if="${#lists.isEmpty(products)}">

                        <td colspan="7"
                            class="text-center py-5">

                            <div class="text-muted">

                                <i class="bi bi-box-seam fs-1 d-block mb-3"></i>

                                Chưa có sản phẩm nào

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>
<!--                -->
            <div class="d-flex justify-content-between align-items-center mt-4" th:if="${totalPages > 1}">
                <div class="text-muted small">
                    Hiển thị trang <span class="fw-bold" th:text="${currentPage + 1}"></span> / <span th:text="${totalPages}"></span>
                </div>

                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm mb-0">

                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                            <a class="page-item page-link" th:href="@{/admin/products(page=${currentPage - 1})}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>

                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${currentPage == i} ? 'active' : ''">
                            <a class="page-link" th:href="@{/admin/products(page=${i})}" th:text="${i + 1}"></a>
                        </li>

                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">
                            <a class="page-item page-link" th:href="@{/admin/products(page=${currentPage + 1})}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>

                    </ul>
                </nav>
            </div>

        </div>

    </div>

</div>

</body>

</html>
