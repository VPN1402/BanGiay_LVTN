<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layouts/main-layout}">

<head>
    <title>Quản lý đơn hàng</title>
</head>

<body>

<div layout:fragment="content">

    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-3 mb-4 border-bottom">
        <div>
            <h1 class="h2 fw-bold mb-1">Quản lý đơn hàng</h1>
            <p class="text-muted mb-0">Danh sách đơn hàng cần xử lý</p>
        </div>
    </div>

    <div class="card border-0 shadow rounded-4">
        <div class="card-body p-4">

            <div class="table-responsive">
                <table class="table align-middle table-hover">
                    <thead class="table-light">
                    <tr>
                        <th>Mã đơn</th>
                        <th>Khách hàng</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th>Thanh toán</th>
                        <th class="text-center">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td class="fw-semibold text-muted" th:text="'#' + ${order.id}"></td>

                        <td th:text="${order.receiverName}"></td>

                        <td class="fw-bold text-danger">
                            <span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'POINT', 0, 'COMMA')}"></span> đ
                        </td>

                        <td>
        <span class="badge"
              th:classappend="${order.orderStatus == 'PENDING' ? 'bg-warning text-dark' : (order.orderStatus == 'SHIPPING' ? 'bg-info' : (order.orderStatus == 'CANCELLED' ? 'bg-danger' : 'bg-success'))}"
              th:text="${order.orderStatus == 'PENDING' ? 'Chờ duyệt' : (order.orderStatus == 'SHIPPING' ? 'Đang giao' : (order.orderStatus == 'CANCELLED' ? 'Đã hủy' : 'Hoàn thành'))}"></span>
                        </td>

                        <td>
        <span class="badge"
              th:classappend="${order.paymentStatus == 'PAID' ? 'bg-success' : (order.paymentStatus == 'REFUND_PENDING' ? 'bg-warning text-dark' : (order.paymentStatus == 'REFUNDED' ? 'bg-secondary' : 'bg-dark'))}"
              th:text="${order.paymentStatus == 'PAID' ? 'Đã thanh toán' : (order.paymentStatus == 'REFUND_PENDING' ? 'Chờ hoàn tiền' : (order.paymentStatus == 'REFUNDED' ? 'Đã hoàn tiền' : 'Chưa thanh toán'))}"></span>
                        </td>

                        <td class="text-center">
                            <a th:href="@{'/admin/orders/details/' + ${order.id}}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-eye"></i> Xem chi tiết
                            </a>

                            <form th:if="${order.paymentStatus == 'REFUND_PENDING'}"
                                  th:action="@{/admin/orders/confirm-refund}"
                                  method="post"
                                  class="d-inline ms-2">
                                <input type="hidden" name="orderId" th:value="${order.id}" />
                                <button type="submit" class="btn btn-sm btn-success"
                                        onclick="return confirm('Bạn đã chuyển khoản trả tiền cho khách và muốn xác nhận ĐÃ HOÀN TIỀN cho đơn này?')">
                                    <i class="bi bi-check2-circle"></i> Xác nhận đã hoàn tiền
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="bi bi-box-seam fs-1 d-block mb-3"></i>
                            Chưa có đơn hàng nào
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
