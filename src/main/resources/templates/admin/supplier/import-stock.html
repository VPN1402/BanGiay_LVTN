<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layouts/main-layout}">
<head>
    <meta charset="UTF-8">
    <title>Nộp Hồ Sơ Báo Giá Đấu Thầu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div layout:fragment="content" class="container py-4">

    <div class="mb-4">
        <h2 class="fw-bold mb-1"><i class="bi bi-file-earmark-spreadsheet text-primary"></i> Nộp Hồ Sơ Báo Giá (File CSV)</h2>
        <p class="text-muted">Tải lên danh sách báo giá cho đợt thu mua tương ứng.</p>
    </div>

    <div th:if="${request != null}" class="alert alert-info shadow-sm mb-4">
        <i class="bi bi-info-circle-fill"></i>
        Bạn đang nộp báo giá cho: <strong>Đợt thu mua #[[${request.id}]]</strong>
        - Ngày tạo: [[${#temporals.format(request.createdAt, 'dd/MM/yyyy')}]]
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form th:action="@{/supplier/bid/save}" method="post" enctype="multipart/form-data">

        <input type="hidden" name="requestId" th:value="${requestId}" />

        <div class="card p-4 mb-4 shadow-sm border-0 bg-white">
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Doanh nghiệp thực hiện báo giá <span class="text-danger">*</span></label>
                    <select class="form-select" name="supplierId" required>
                        <option value="">-- Chọn Nhà cung cấp --</option>
                        <option th:each="sup : ${allSuppliers}"
                                th:value="${sup.id}"
                                th:text="${sup.name}">
                        </option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Chọn File CSV Báo Giá <span class="text-danger">*</span></label>
                    <input type="file" name="file" class="form-control" accept=".csv" required>
                    <div class="form-text text-danger fw-semibold mt-2">
                        <i class="bi bi-info-circle-fill"></i> Cấu trúc CSV: Mã SP, Tên SP, Size, Số lượng, Giá nhập thầu
                    </div>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-semibold">Ghi chú kèm theo</label>
                    <textarea name="note" class="form-control" rows="4" placeholder="Nhập ghi chú..."></textarea>
                </div>

            </div>
        </div>

        <div class="text-end">
            <a th:href="@{/supplier/bid/list}" class="btn btn-secondary me-2 px-4">
                <i class="bi bi-arrow-left"></i> Quay lại danh sách
            </a>
            <button type="submit" class="btn btn-primary px-4 fw-bold">
                <i class="bi bi-cloud-upload me-1"></i> Gửi Hồ Sơ Báo Giá
            </button>
        </div>

    </form>
</div>

</body>
</html>
