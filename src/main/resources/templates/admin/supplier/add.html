<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{admin/layouts/main-layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Thêm Nhà Cung Cấp & Cấp Tài Khoản</title>
</head>
<body>
<div layout:fragment="content" class="container py-4">

    <div class="mb-4">
        <h2 class="fw-bold"><i class="bi bi-building-add text-primary"></i> Thêm Nhà Cung Cấp & Cấp Tài Khoản</h2>
        <p class="text-muted">Admin thêm doanh nghiệp đối tác mới và thiết lập tài khoản đăng nhập trực tiếp cho họ.</p>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/admin/supplier/save}" method="post">
        <div class="row">

            <div class="col-md-6 mb-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-primary text-white fw-bold">
                        <i class="bi bi-info-circle"></i> Thông Tin Nhà Cung Cấp
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên Nhà Cung Cấp / Công Ty <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" placeholder="VD: Công ty TNHH Nike Việt Nam" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Số điện thoại công ty</label>
                            <input type="text" name="supplierPhone" class="form-control" placeholder="VD: 028XXXXXXXX">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Địa chỉ trụ sở</label>
                            <textarea name="address" class="form-control" rows="3" placeholder="Nhập địa chỉ công ty..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-dark text-white fw-bold">
                        <i class="bi bi-shield-lock"></i> Cấp Tài Khoản Đăng Nhập
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Họ tên người đại diện <span class="text-danger">*</span></label>
                            <input type="text" name="fullName" class="form-control" placeholder="VD: Nguyễn Văn A" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email đăng nhập (Duy nhất) <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control" placeholder="VD: nike_partner@gmail.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Số điện thoại cá nhân</label>
                            <input type="text" name="userPhone" class="form-control" placeholder="VD: 09XXXXXXXX">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mật khẩu cấp phát <span class="text-danger">*</span></label>
                            <input type="text" name="password" class="form-control" value="Supplier@123" title="Mật khẩu mặc định Admin cấp, NCC có thể đổi sau" required>
                            <div class="form-text text-muted">Gợi ý mật khẩu mặc định sẵn, bạn có thể sửa lại trước khi lưu.</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="text-end mt-3">
            <a th:href="@{/admin/import/list}" class="btn btn-secondary me-2">Quay Lại</a>
            <button type="submit" class="btn btn-success px-4 fw-bold">
                <i class="bi bi-check-circle"></i> Lưu & Kích Hoạt Tài Khoản
            </button>
        </div>
    </form>
</div>
</body>
</html>
