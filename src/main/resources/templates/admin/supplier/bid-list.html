<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layouts/main-layout}"
>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div layout:fragment="content" class="container py-4">
  <div class="mb-4">
    <h3 class="fw-bold text-dark"><i class="bi bi-mailbox2 text-primary"></i> Hộp thư yêu cầu báo giá</h3>
    <p class="text-muted">Danh sách các đợt gọi thầu vật tư, sản phẩm từ phòng mua hàng Admin.</p>
  </div>

  <div class="row g-3">
    <div class="col-md-6" th:each="r : ${requests}">
      <div class="card border-0 shadow-sm rounded-4 h-100">
        <div class="card-body p-4 d-flex flex-column justify-content-between">
          <div>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill fw-bold">Yêu cầu #[[${r.id}]]</span>
              <span class="text-muted small"><i class="bi bi-clock"></i> [[${#temporals.format(r.createdAt, 'dd/MM/yyyy')}]]</span>
            </div>
            <h5 class="fw-bold text-secondary">Đợt thu mua bổ sung tồn kho</h5>
            <p class="text-muted text-truncate-2 small" th:text="${r.note != null ? r.note : 'Không có ghi chú kèm theo từ Admin.'}"></p>
          </div>

          <div class="mt-3">
            <a th:href="@{'/supplier/bid/detail/' + ${r.id}}" class="btn btn-outline-primary w-100 rounded-3 fw-semibold">
              <i class="bi bi-eye-fill me-1"></i> Xem chi tiết yêu cầu
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
  </tbody>
</table>
</body>
</html>
