<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{admin/layouts/main-layout}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
  <title>Cập Nhật Nhà Cung Cấp Giày</title>
</head>
<body>
<div layout:fragment="content" class="container py-4" style="max-width: 750px;">

  <div class="mb-3">
    <a th:href="@{/admin/suppliers}" class="text-decoration-none text-secondary">
      &larr; Trở lại danh sách đối tác
    </a>
  </div>

  <h2 class="fw-bold mb-4">⚙️ Chỉnh Sửa Đối Tác Cung Cấp</h2>

  <div class="card p-4 shadow-sm border-0 rounded-3">

    <form th:action="@{/admin/supplier/save}" method="post" th:object="${supplier}">

      <input type="hidden" th:field="*{id}" />
      <input type="hidden" th:field="*{createdAt}" />

      <div class="row g-3">
        <div class="col-md-12">
          <label class="form-label fw-semibold">Tên Nhà cung cấp / Xưởng giày <span class="text-danger">*</span></label>
          <input type="text"
                 th:field="*{name}"
                 class="form-control"
                 th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                 placeholder="Ví dụ: Tổng kho sỉ giày Adidas miền Nam...">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Số điện thoại liên hệ <span class="text-danger">*</span></label>
          <input type="tel"
                 th:field="*{phone}"
                 class="form-control"
                 th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                 placeholder="Ví dụ: 0901234567">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Email kinh doanh (nếu có)</label>
          <input type="email"
                 th:field="*{email}"
                 class="form-control"
                 th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                 placeholder="Ví dụ: hoptac@xuonggiaythethao.com">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="col-md-12">
          <label class="form-label fw-semibold">Địa chỉ trụ sở / Kho lấy hàng</label>
          <textarea th:field="*{address}" class="form-control" rows="3" placeholder="Nhập địa chỉ chi tiết nơi xuất kho hoặc xưởng sản xuất..."></textarea>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
        <a th:href="@{/admin/suppliers}" class="btn btn-light px-4">Hủy bỏ</a>
        <button type="submit" class="btn btn-primary px-4">Cập Nhật</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
