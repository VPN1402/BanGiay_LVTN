<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layouts/main-layout}">

<head>
    <title th:text="${category.id == null ? 'Thêm danh mục' : 'Sửa danh mục'}"></title>
</head>

<body>

<div layout:fragment="content">

    <!-- PAGE TITLE -->
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">

        <div>

            <h1 class="h2 fw-bold"
                th:text="${category.id == null ? 'Thêm danh mục mới' : 'Cập nhật danh mục'}">
            </h1>

            <p class="text-muted mb-0">
                Quản lý danh mục sản phẩm
            </p>

        </div>

    </div>

    <!-- CARD -->
    <div class="card shadow border-0 rounded-4">

        <div class="card-body p-4">

            <form th:action="@{/admin/category/save}"
                  th:object="${category}"
                  method="post">

                <!-- ID -->
                <input type="hidden"
                       th:field="*{id}"/>

                <!-- NAME -->
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Tên danh mục
                    </label>

                    <input type="text"
                           th:field="*{name}"
                           class="form-control form-control-lg"
                           placeholder="Nhập tên danh mục..."
                           required>

                </div>

                <!-- DESCRIPTION -->
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Mô tả
                    </label>

                    <textarea th:field="*{description}"
                              class="form-control"
                              rows="5"
                              placeholder="Nhập mô tả danh mục...">
                    </textarea>

                </div>
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Ảnh danh mục
                    </label>

                    <input type="text"
                           th:field="*{thumbnail}"
                           class="form-control"
                           placeholder="https://example.com/image.jpg">

                </div>
                <!-- FEATURED -->
                <div class="form-check mb-4">

                    <input class="form-check-input"
                           type="checkbox"
                           th:field="*{featured}">

                    <label class="form-check-label fw-semibold">

                        Hiển thị ở danh mục nổi bật

                    </label>

                </div>

                <!-- BUTTON -->
                <div class="d-flex gap-2 mt-4">

                    <button type="submit"
                            class="btn btn-primary px-4">

                        <i class="bi bi-save"></i>

                        <span th:text="${category.id == null ? 'Thêm danh mục' : 'Cập nhật'}"></span>

                    </button>

                    <a th:href="@{/admin/categories}"
                       class="btn btn-outline-secondary">

                        Quay lại

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
