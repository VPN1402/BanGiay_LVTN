<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="'$CONTENT_TITLE - Admin Dashboard'">Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/admin/css/admin-style.css}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="wrapper">
    <nav id="sidebar" th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>

    <div id="content" class="d-flex flex-column">
        <nav class="navbar navbar-expand-lg navbar-light" th:replace="~{admin/fragments/navbar :: navbar}"></nav>

        <div class="container-fluid p-4 flex-grow-1">
            <div layout:fragment="content">
            </div>
        </div>

        <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/admin/js/admin-script.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
