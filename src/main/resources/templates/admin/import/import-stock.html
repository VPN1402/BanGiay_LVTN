<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layouts/main-layout}">
<head>
    <title>Tạo Phiếu Nhập Kho Từ CSV</title>
</head>
<body>

<div layout:fragment="content" class="container py-4">
    <h2 class="fw-bold mb-4">Tạo Phiếu Yêu Cầu Nhập Kho Từ File CSV</h2>

    <form th:action="@{/admin/import/save}" method="post" enctype="multipart/form-data">

        <div class="card p-4 mb-4 shadow-sm border-0">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Nhà cung cấp <span class="text-danger">*</span></label>
                    <select name="supplierId" class="form-select" required>
                        <option value="">-- Chọn nhà cung cấp --</option>
                        <option th:each="s : ${allSuppliers}" th:value="${s.id}" th:text="${s.name}"></option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Chọn File CSV Danh Sách Hàng <span class="text-danger">*</span></label>
                    <input type="file" name="file" class="form-control" accept=".csv" required>
                    <div class="form-text text-muted">Hệ thống chỉ chấp nhận định dạng file .csv (Cột: Mã kích thước, Số lượng, Giá nhập)</div>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-semibold">Ghi chú phiếu nhập</label>
                    <textarea name="note" class="form-control" rows="3" placeholder="Ví dụ: Nhập kho lô hàng giày Sneaker đợt tháng 6 theo file CSV đối tác gửi..."></textarea>
                </div>
            </div>
        </div>

        <div class="text-end">
            <a href="/admin/import/list" class="btn btn-secondary me-2">Quay Lại</a>
            <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-upload me-1"></i> Tải Lên & Tạo Phiếu Nháp
            </button>
        </div>
    </form>
</div>

</body>
</html>
