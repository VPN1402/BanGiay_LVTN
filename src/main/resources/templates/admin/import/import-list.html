<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layouts/main-layout}">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Phiếu Thầu Nhập Kho</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div layout:fragment="content" class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Quản Lý Hồ Sơ Đấu Thầu Nhập Kho</h2>
    </div>

    <div th:if="${successMessage}" class="alert alert-success border-0 shadow-sm" th:text="${successMessage}"></div>

    <div class="card shadow-sm p-4">
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-light text-center">
                <tr>
                    <th style="width: 5%;">ID</th>
                    <th style="width: 15%;">Nhà Cung Cấp</th>
                    <th style="width: 15%;">Người Đại Diện</th>
                    <th style="width: 18%;">Ngày Nộp Đơn</th>
                    <th style="width: 15%;">Tổng Tiền Dự Kiến</th>
                    <th style="width: 17%;">Trạng Thái Phiếu</th>
                    <th style="width: 15%;">Hành Động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${receipts}">
                    <td class="text-center fw-bold" th:text="${r.id}"></td>
                    <td th:text="${r.supplier != null ? r.supplier.name : 'N/A'}"></td>
                    <td th:text="${r.user != null ? r.user.fullName : 'Hệ thống'}"></td>
                    <td class="text-center" th:text="${#temporals.format(r.importDate, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="text-end text-danger fw-semibold"
                        th:text="${#numbers.formatDecimal(r.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>

                    <td class="text-center">
                        <span th:if="${r.status == 'PENDING'}" class="badge bg-warning text-dark px-2 py-2 w-100">
                            <i class="bi bi-hourglass-split"></i> Chờ BQL Duyệt
                        </span>
                        <span th:if="${r.status == 'APPROVED'}" class="badge bg-info text-dark px-2 py-2 w-100">
                            <i class="bi bi-truck"></i> Đã Duyệt - Chờ Kho
                        </span>
                        <span th:if="${r.status == 'COMPLETED'}" class="badge bg-success px-2 py-2 w-100">
                            <i class="bi bi-check-circle-fill"></i> Đã Nhập Kho
                        </span>
                        <span th:if="${r.status == null}" class="badge bg-light text-dark px-2 py-2 w-100">Mới tạo</span>
                    </td>

                    <td class="text-center">
                        <a th:href="@{'/admin/import/detail/' + ${r.id}}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-shield-lock-fill"></i> Xem & Xét Duyệt
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(receipts)}">
                    <td colspan="7" class="text-center text-muted py-5">
                        <i class="bi bi-folder-x fs-2 d-block mb-2"></i>
                        Hiện tại chưa có hồ sơ báo giá nào từ nhà cung cấp.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
